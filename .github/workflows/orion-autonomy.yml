name: L.U.M.I.N.A. family council

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover sources and trusted owner goals without using the model or opening an issue"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: lumina-family-council
  cancel-in-progress: false

jobs:
  learn-and-speak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install L.U.M.I.N.A.
        run: python -m pip install .
      - name: Verify the family council before every run
        run: python -m unittest discover -s tests -v
      - name: Learn together and speak through an issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "## Family council waiting for activation" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the protected OPENAI_API_KEY repository secret to enable live family learning." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            orion-autonomy --dry-run
          else
            orion-autonomy
          fi
